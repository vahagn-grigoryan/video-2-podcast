name: Probe YouTube

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -U yt-dlp
      - run: node --version
      - name: List and download the latest Fireship video's audio
        run: |
          yt-dlp --js-runtimes node --playlist-end 1 -f "bestaudio[ext=m4a]" \
            -o "probe.%(ext)s" --print "%(id)s | %(title)s | %(duration_string)s" \
            "https://www.youtube.com/@Fireship/videos"
          ls -la probe.*
